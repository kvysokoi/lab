<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Трекер інцидентів кібербезпеки</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="/app.ts"></script>
</head>
<body>

<header>
  <h1>Лабораторна робота 1 (Варіант 2)</h1>
</header>

<div id="authSection">
  <div class="auth-box">

    <div id="loginPanel">
      <h2>Вхід</h2>
      <form id="loginForm">
        <label>Логін</label>
        <input type="text" id="loginUsername" placeholder="student1" required>
        <label>Пароль</label>
        <input type="password" id="loginPassword" placeholder="user123" required>
        <button type="submit">Увійти</button>
      </form>
      <p style="text-align:center;margin-top:10px">
        Немає акаунту?
        <button id="showRegisterBtn" style="background:none;color:#4a90e2;border:none;cursor:pointer;padding:0">Реєстрація</button>
      </p>
      <p style="font-size:12px;color:#999;text-align:center;margin-top:8px">
        Demo: admin/admin123 · student1/user123 · student2/user123
      </p>
    </div>

    <div id="registerPanel" style="display:none">
      <h2>Реєстрація</h2>
      <form id="registerForm">
        <label>Логін</label>
        <input type="text" id="regUsername" placeholder="мінімум 3 символи" required>
        <label>Пароль</label>
        <input type="password" id="regPassword" placeholder="мінімум 6 символів" required>
        <button type="submit">Зареєструватись</button>
      </form>
      <p style="text-align:center;margin-top:10px">
        Вже є акаунт?
        <button id="showLoginBtn" style="background:none;color:#4a90e2;border:none;cursor:pointer;padding:0">Увійти</button>
      </p>
    </div>

    <p id="authError" style="color:red;text-align:center;margin-top:8px"></p>
  </div>
</div>

<div id="appSection" style="display:none">

<main>

  <!-- Панель поточного користувача -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <span id="currentUser" style="font-weight:bold;color:#4a90e2"></span>
    <button id="logoutBtn" style="background:#e74c3c;padding:6px 14px">🚪 Вийти</button>
  </div>

<section>
<h2>Додати / Редагувати інцидент</h2>

<form id="incidentForm">

<label for="titleInput">Назва інциденту</label>
<input type="text" id="titleInput">
<p class="error-text" id="titleError"></p>

<label for="severitySelect">Критичність</label>
<select id="severitySelect">
<option value="">Оберіть</option>
<option value="Low">Low</option>
<option value="Medium">Medium</option>
<option value="High">High</option>
</select>
<p class="error-text" id="severityError"></p>

<label for="statusSelect">Статус</label>
<select id="statusSelect">
<option value="">Оберіть</option>
<option value="Open">Open</option>
<option value="In Progress">In Progress</option>
<option value="Closed">Closed</option>
</select>
<p class="error-text" id="statusError"></p>

<label for="dateInput">Дата</label>
<input type="date" id="dateInput">
<p class="error-text" id="dateError"></p>

<button type="submit" id="submitBtn">Додати</button>

</form>
</section>

<section>
<h2>Пошук та фільтр</h2>

<input type="text" id="searchInput" placeholder="Пошук по назві">

<select id="filterSeverity">
<option value="">Фільтр за критичністю</option>
<option value="Low">Low</option>
<option value="Medium">Medium</option>
<option value="High">High</option>
</select>

<select id="sortSelect">
<option value="">Сортування</option>
<option value="date">За датою</option>
<option value="severity">За критичністю</option>
</select>

</section>

<section>
<h2>Список інцидентів</h2>

<table>
<thead>
    <tr>
        <th style="cursor: pointer;" data-sort="title">Назва ↕</th>
        <th style="cursor: pointer;" data-sort="severity">Критичність ↕</th>
        <th style="cursor: pointer;" data-sort="status">Статус ↕</th>
        <th style="cursor: pointer;" data-sort="date">Дата ↕</th>
        <th>Дії</th>
    </tr>
</thead>
<tbody id="incidentTableBody"></tbody>
</table>

</section>

</main>
</div>

</body>
</html>
